<!-- 
Full screen example game on mobile. Handles touch events.
-->
<style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }    
</style>
   

<canvas id="gameCanvas"></canvas>


<script type="text/python" id="brythonpre">
from browser import document, window

import sys
class __ErrorReporter:
    def __init__(self):
        self.errdiv = None
    def write(self, msg):
        if self.errdiv is None:
            self.errdiv = document.createElement("div")
            self.errdiv.style = "white-space: pre-wrap; font-family: monospace; color:red"
            document.body.insertBefore(self.errdiv, document.body.firstChild)
        self.errdiv.textContent += ("\n" + msg)
sys.stderr = __ErrorReporter()

# Load sound resouces

# Load image resources

# Load other file resources (css, fonts, etc.) as data URLs

# Load modules - use runPythonSource as it is synchronous
for module in []:
    __BRYTHON__.runPythonSource(document[module].text, module.replace('__pwe_', ''))

<script type="text/python" id="pythoncode">
import math
from browser import document, window, bind

canvas = document.getElementById("gameCanvas")
ctx = canvas.getContext("2d")

# Position of helicopter on screen.
# 0, 0 is at center of screen.
heli = (0, 0)
heliwidth = 20

class Bucket:
    """Class that defaults to False on attribute access.
    Otherwise allows easy assignment and clearing of all attributes.
    """
    def __init__(self):
        self._mydata = dict()

    def __getattr__(self, attr):
        return self._mydata.get(attr, False)

    def __setattr__(self, name, value):
        # Special handling for our internal _mydata dictionary
        if name == '_mydata':
            super().__setattr__(name, value)
        else:
            self._mydata[name] = value

    def clear(self):
        self._mydata.clear()

        
keyboard = Bucket()


class Touch:
    """Holds the touch state in canvas rendering coordinates"""

    def __init__(self, canvas):
        self.canvas = canvas
        self.active = False
        self.x = 0
        self.y = 0

        self.canvas.bind("touchstart", self.on_touch_start)
        self.canvas.bind("touchmove", self.on_touch_move)
        self.canvas.bind("touchend", self.on_touch_end)
        self.canvas.bind("touchcancel", self.on_touch_end)

    def _get_canvas_pos(self, touch_event):
        """Convert screen coords to canvas coords"""
        rect = self.canvas.getBoundingClientRect()
        # Convert screen coords → virtual game coords
        scale_x = self.canvas.width / rect.width
        scale_y = self.canvas.height / rect.height
        return ((touch_event.clientX - rect.x) * scale_x, 
                (touch_event.clientY - rect.y) * scale_y)

    def on_touch_start(self, ev):
        ev.preventDefault()  # Prevents scroll/zoom
        t = ev.changedTouches[0]
        self.active = True
        self.x, self.y = self._get_canvas_pos(t)
    
    def on_touch_move(self, ev):
        ev.preventDefault()
        t = ev.changedTouches[0]
        self.x, self.y = self._get_canvas_pos(t)
    
    def on_touch_end(self, ev):
        ev.preventDefault()
        self.active = False

touch = Touch(canvas)

@bind(document, "keydown")
def keyDownHandler(e):
    global keyboard
    if e.key.isalpha() or e.key.startswith('Arrow'):
        setattr(keyboard, e.key, True)

        
@bind(document, "keyup")
def keyUpHandler(e):
    global keyboard
    if e.key.isalpha() or e.key.startswith('Arrow'):
        setattr(keyboard, e.key, False)


def resize_canvas(_):
    # Set the canvas size (the thing on the screen) to the 
    # size of the actual window so that we take up the full screen.
    canvas.style.width = str(window.innerWidth) + 'px'
    canvas.style.height = str(window.innerHeight) + 'px'

    # Now, if we just want 1:1 drawing, make the render canvas
    # size the same size too. No scaling, but might be slow on large screens.
    # Weirdly, you can't just write:
    #
    # canvas.width = window.innerWidth
    # canvas.height = window.innerHeight
    #
    # due to weird interaction between brython, javascript, and
    # the DOM - need to use setAttribute instead. Later, you can
    # still read from canvas.width and canvas.height.
    canvas.setAttribute('width', window.innerWidth)
    canvas.setAttribute('height', window.innerHeight)


def draw_rect(x, y, width, height, color):
    ctx.fillStyle = color
    ctx.fillRect(
        round(x),
        round(y),
        round(width),
        round(height))


def game_loop(now):
    update(now)
    draw(now)
    window.requestAnimationFrame(game_loop)


def update(t):
    """Update the game state based on events."""
    global heli
    dx, dy = 0, 0
    if touch.active:
        # Inputs coming from touch events on mobile
        # Chase the touch pos
        tpos = (touch.x - canvas.width/2,
                touch.y - canvas.height/2)
        delta = (tpos[0] - heli[0], tpos[1] - heli[1])
        mag = math.sqrt(delta[0]**2 + delta[1]**2)
        if mag > 20:
            # Far enough away - chase it
            dx = delta[0] / mag * 5
            dy = delta[1] / mag * 5
    else:
        if keyboard.ArrowLeft:
            dx = -5
        if keyboard.ArrowRight:
            dx = 5
        if keyboard.ArrowUp:
            dy = -5
        if keyboard.ArrowDown:
            dy = 5
    heli = (heli[0] + dx, heli[1] + dy)
    
    
def draw(t):
    """Draw the game state"""
    draw_rect(0, 0, canvas.width, canvas.height, "#000")

    # Draw a square that should be a square no matter the screen size,
    # But scales size with screen width.
    ref_width = canvas.width / 3
    draw_rect(
        canvas.width / 2 - ref_width / 2,
        canvas.height / 2 - ref_width / 2 + canvas.height / 5 * math.sin(t / 500),
        ref_width,
        ref_width,  
        "#33a")

    # Now draw a square that has a fixed size no matter the screen
    # width or height.
    draw_rect(
        canvas.width/2 - heliwidth / 2 + heli[0],
        canvas.height/2 - heliwidth / 2 + heli[1],
        heliwidth,
        heliwidth,
        "#0fc")
    

resize_canvas(0)
window.addEventListener("resize", resize_canvas)
game_loop(0)
</script>
